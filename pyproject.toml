[project]
name = "messenger-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "phonenumbers>=9.0.34",
    "pydantic[email]>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "asyncpg>=0.31.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messenger"]

[project.scripts]
messenger = "messenger.cli:main_menu"
